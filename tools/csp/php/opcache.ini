; Chỉ cho bản chạy khảo sát CSP (tools/csp/survey.cjs): `php artisan serve` chạy PHP CLI, mà
; image webdevops tắt opcache cho CLI — mỗi request biên dịch lại toàn bộ vendor qua bind mount
; của Docker trên Windows (đo được ~21 giây cho trang một vụ việc). Nạp bằng:
;   /d/vkwt/m8-dev serve -e CSP_MODE=report -e PHP_INI_SCAN_DIR=:/var/www/html/tools/csp/php
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=30000
